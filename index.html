<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08111b">
<link rel="icon" href="data:,">
<title>百战天元 · 夜宴</title>
<style>
/* ═══════════ TOKENS（与 src/render/view/palette.ts 逐值同步）═══════════ */
:root{
  --n0:#050b13; --n1:#08111b; --n2:#0c1724; --n3:#122031; --n4:#1a2c42;
  --gold:#b39660; --gold-hi:#e3cfa0; --gold-dim:rgba(179,150,96,.32);
  --cream:#f7e7c3; --paper:#f2ecdd;
  --jade:#9ec4ae; --jade-deep:#33524a;
  --cinnabar:#c65a45; --cin-deep:#6b2a1e;
  --tx:#ece5d4; --dim:#7e8b9b;
  --ez-in:cubic-bezier(.37,.16,.12,1);
  --ez-page:cubic-bezier(.7,0,.3,1);
  --kai:"Kaiti SC","STKaiti","KaiTi",serif;
  --song:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--gold);color:var(--n1)}
html,body{height:100%;overflow:hidden;background:var(--n1);color:var(--tx);
  font-family:var(--song);-webkit-font-smoothing:antialiased}
body{cursor:none}
@media(pointer:coarse){body{cursor:auto}}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* ═══════════ 自定义光标（dot 即时 / ring 追赶）═══════════ */
#cur-dot,#cur-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:4000;border-radius:50%}
#cur-dot{width:4px;height:4px;background:var(--gold-hi);transform:translate(-50%,-50%)}
#cur-ring{width:26px;height:26px;border:1px solid var(--gold-dim);transform:translate(-50%,-50%);
  transition:width .4s var(--ez-in),height .4s var(--ez-in),border-color .4s}
body.cur-hover #cur-ring{width:46px;height:46px;border-color:var(--gold)}
@media(pointer:coarse){#cur-dot,#cur-ring{display:none}}
#app canvas{cursor:none!important}

/* ═══════════ 加载序章 ═══════════ */
#boot{position:fixed;inset:0;z-index:5000;background:var(--n1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;
  transition:clip-path 1.2s var(--ez-page);clip-path:inset(0 0 0 0)}
#boot.hidden{clip-path:inset(0 0 100% 0);pointer-events:none}
/* 开屏「天」以篆书起笔：篆体子集就绪（main.ts 挂 seal 类）后才入场 */
#boot .glyph{font-family:"XiaoZhuan",var(--kai);font-size:130px;color:var(--paper);line-height:1;opacity:0}
#boot.seal .glyph{animation:glyphIn 1.5s var(--ez-in) .15s forwards}
@keyframes glyphIn{from{opacity:0;transform:scale(1.14);filter:blur(12px)}
  to{opacity:1;transform:scale(1);filter:blur(0)}}
#boot .bar{width:200px;height:1px;background:rgba(179,150,96,.18);position:relative;overflow:hidden}
#boot .bar i{position:absolute;inset:0;background:linear-gradient(90deg,var(--gold),var(--gold-hi));
  transform-origin:left;transform:scaleX(0);animation:barfill 1.1s var(--ez-in) .3s forwards}
@keyframes barfill{to{transform:scaleX(1)}}
#boot .tip{font-size:10px;letter-spacing:.55em;text-indent:.55em;color:var(--dim)}

/* ═══════════ 游戏画布 ═══════════ */
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app canvas{display:block;image-rendering:auto}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div id="cur-dot"></div><div id="cur-ring" aria-hidden="true"></div>

<div id="boot" aria-hidden="true">
  <div class="glyph">天</div>
  <div class="bar"><i></i></div>
  <div class="tip">九幽墨卷 · 徐徐展开</div>
</div>

<div id="app"></div>

<noscript>
  <p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#f2ecdd;background:#08111b;z-index:9000;text-align:center;padding:0 24px">
    百战天元需要在浏览器启用 JavaScript 后对弈。
  </p>
</noscript>

<script>
/* ═══════════ 光标：dot 即时跟随，ring 0.15 追赶；hover 态由 Phaser 事件桥接（main.ts）═══════════ */
(function(){
  var dot=document.getElementById('cur-dot'),ringEl=document.getElementById('cur-ring');
  if(!dot)return;
  var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;
    dot.style.left=mx+'px';dot.style.top=my+'px'});
  (function loop(){rx+=(mx-rx)*.15;ry+=(my-ry)*.15;
    ringEl.style.left=(rx-13)+'px';ringEl.style.top=(ry-13)+'px';
    requestAnimationFrame(loop)})();
})();

/* ═══════════ 夜色山海（静态层启动/resize 烘焙一次；逐帧只画星/尘/涟漪）═══════════ */
(function(){
  var bg=document.getElementById('bg');
  if(!bg)return;
  var bx=bg.getContext('2d');
  var W,H,dpr=Math.min(2,window.devicePixelRatio||1);
  var staticCv=null,grainCv=null;

  /* 纸纹颗粒（烘焙一次的 256 噪声块） */
  function bakeGrain(){
    grainCv=document.createElement('canvas');grainCv.width=grainCv.height=256;
    var g=grainCv.getContext('2d');
    var im=g.createImageData(256,256);
    for(var i=0;i<im.data.length;i+=4){
      var v=200+Math.random()*55;
      im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=Math.random()*26;
    }
    g.putImageData(im,0,0);
  }

  /* 山脊线：分层噪声 */
  function ridge(x,seed){return Math.sin(x*3.1+seed)*.5+Math.sin(x*7.3+seed*2.1)*.26+Math.sin(x*13.7+seed*4.3)*.13}
  var LAYERS=[
    {y:.70,amp:.09,seed:1.7,col:'rgba(20,34,51,.55)'},
    {y:.78,amp:.07,seed:4.2,col:'rgba(13,24,37,.7)'},
    {y:.86,amp:.06,seed:8.9,col:'rgba(8,15,24,.85)'}];

  /* 静态合成：夜空/月晕/云絮/远山/雾带/颗粒/暗角 —— 全部一次成型 */
  function bakeStatic(){
    staticCv=document.createElement('canvas');
    staticCv.width=W*dpr;staticCv.height=H*dpr;
    var g=staticCv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    /* 夜空 */
    var gr=g.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'#0b1622');gr.addColorStop(.55,'#0c1724');gr.addColorStop(1,'#050b13');
    g.fillStyle=gr;g.fillRect(0,0,W,H);
    /* 月色：云雾后的一团光，不见月轮 */
    var mx=W*.82,my=H*.17,mr=Math.min(W,H)*.42;
    var halo=g.createRadialGradient(mx,my,0,mx,my,mr);
    halo.addColorStop(0,'rgba(232,220,190,.12)');halo.addColorStop(.35,'rgba(232,220,190,.05)');
    halo.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=halo;g.beginPath();g.arc(mx,my,mr,0,7);g.fill();
    g.save();g.filter='blur(14px)';
    g.fillStyle='rgba(240,230,200,.16)';
    g.beginPath();g.arc(mx,my,Math.min(W,H)*.035,0,7);g.fill();g.restore();
    /* 云絮横过月色（烘焙期一次性模糊） */
    g.save();g.filter='blur(24px)';
    for(var i=0;i<3;i++){
      var cy=my+(i-1)*H*.05,cx=mx;
      g.fillStyle='rgba(11,21,33,'+(.5-i*.12)+')';
      g.beginPath();g.ellipse(cx,cy,W*.13,H*.022,0,0,7);g.fill();
    }
    g.restore();
    /* 远山 · 虚化水墨远影（烘焙期一次性模糊） */
    g.save();g.filter='blur(7px)';
    LAYERS.forEach(function(L){
      g.beginPath();g.moveTo(-10,H+10);
      for(var x=-10;x<=W+10;x+=6){g.lineTo(x,H*L.y+ridge(x/W,L.seed)*H*L.amp)}
      g.lineTo(W+10,H+10);g.closePath();g.fillStyle=L.col;g.fill();
    });
    g.restore();
    /* 雾带 */
    [[.66,.12],[.78,.14]].forEach(function(ff,i){
      var fy=ff[0],fh=ff[1];
      var fg=g.createLinearGradient(0,H*fy,0,H*(fy+fh));
      fg.addColorStop(0,'rgba(18,32,49,0)');fg.addColorStop(.5,'rgba(160,172,190,'+(.045-i*.015)+')');
      fg.addColorStop(1,'rgba(18,32,49,0)');g.fillStyle=fg;g.fillRect(0,H*fy,W,H*fh);
    });
    /* 纸纹颗粒（overlay 一次成型，逐帧零开销） */
    if(grainCv){
      g.globalAlpha=.5;g.globalCompositeOperation='overlay';
      g.fillStyle=g.createPattern(grainCv,'repeat');g.fillRect(0,0,W,H);
      g.globalCompositeOperation='source-over';g.globalAlpha=1;
    }
    /* 暗角 */
    var v=g.createRadialGradient(W/2,H*.46,Math.min(W,H)*.3,W/2,H*.5,Math.max(W,H)*.75);
    v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(3,7,12,.5)');
    g.fillStyle=v;g.fillRect(0,0,W,H);
  }

  function sizeBG(){
    W=innerWidth;H=innerHeight;
    bg.width=W*dpr;bg.height=H*dpr;
    bg.style.width=W+'px';bg.style.height=H+'px';
    bx.setTransform(dpr,0,0,dpr,0,0);
    bakeStatic();
  }

  /* 逐帧动层：星 / 金尘 / 涟漪 —— 无滤镜、无全屏渐变 */
  var stars=[],dust=[],ripples=[];
  function seedAmbient(){
    stars=[];dust=[];
    for(var i=0;i<46;i++)stars.push({x:Math.random(),y:Math.random()*.5,s:.4+Math.random()*.9,a:Math.random()*6.28});
    for(var j=0;j<70;j++)dust.push({x:Math.random(),y:Math.random(),s:.4+Math.random()*1.1,
      v:.00003+Math.random()*.0001,a:Math.random()*6.28});
  }
  setInterval(function(){
    if(document.hidden)return;
    ripples.push({x:Math.random()*W,y:Math.random()*H,r:6,a:1});
    if(ripples.length>4)ripples.shift();
  },3800);

  function draw(t){
    bx.clearRect(0,0,W,H);
    if(staticCv)bx.drawImage(staticCv,0,0,W,H);
    /* 星 */
    for(var i=0;i<stars.length;i++){var s=stars[i];
      bx.globalAlpha=.18+Math.sin(t*.0009+s.a)*.12;
      bx.fillStyle='#e8dfc8';bx.beginPath();bx.arc(s.x*W,s.y*H,s.s,0,7);bx.fill();
    }
    bx.globalAlpha=1;
    /* 金尘 */
    for(var j=0;j<dust.length;j++){var d=dust[j];
      d.y-=d.v;d.x+=Math.sin(t*.0003+d.a)*.0002;if(d.y<-.01)d.y=1.01;
      bx.globalAlpha=.2+Math.sin(t*.001+d.a)*.13;bx.fillStyle='#e3cfa0';
      bx.beginPath();bx.arc(d.x*W,d.y*H,d.s,0,7);bx.fill();
    }
    bx.globalAlpha=1;
    /* 涟漪 */
    ripples=ripples.filter(function(r){return r.a>.01});
    for(var k=0;k<ripples.length;k++){var r=ripples[k];
      r.r+=1.5;r.a*=.965;
      bx.strokeStyle='rgba(227,207,160,'+(r.a*.28)+')';bx.lineWidth=1;
      bx.beginPath();bx.arc(r.x,r.y,r.r,0,7);bx.stroke();
    }
  }

  var last=performance.now();
  function loop(t){draw(t);requestAnimationFrame(loop)}
  bakeGrain();sizeBG();seedAmbient();
  addEventListener('resize',function(){sizeBG()});
  requestAnimationFrame(loop);
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
