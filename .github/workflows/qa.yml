name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与本地/engines 同源：node:sqlite（balance 工具链）要求 ≥22.5，
          # 写死 "22" 会随 runner 默认漂移，读 .nvmrc 保证三处一致
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run qa

      # 发布门禁里最便宜的两道前置到 PR 阶段：许可证/哈希漂移与高危依赖
      # 在合并前暴露，而不是积压到 npm run release 才爆炸
      - name: Audit dependencies
        run: npm run audit:deps

      - name: Audit music licensing
        run: npm run audit:music
