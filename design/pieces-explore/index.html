<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>棋子美术技术探索 · 四路线对比</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #101216;
    color: #cfd3da;
    font-family: "Songti SC", "Noto Serif SC", SimSun, serif;
    padding: 28px 34px 60px;
  }
  h1 { font-size: 22px; letter-spacing: 6px; color: #e8e2d4; font-weight: 600; }
  .sub { font-size: 13px; color: #7d838e; margin: 8px 0 26px; letter-spacing: 1px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th, td { border: 1px solid #23262d; padding: 10px 8px; vertical-align: top; }
  th { font-size: 14px; color: #e0d8c6; letter-spacing: 2px; font-weight: 600; background: #15171c; }
  th .en { display: block; font-size: 11px; color: #6b7280; letter-spacing: 1px; margin-top: 3px; font-family: Georgia, serif; }
  td.rowhead { width: 190px; background: #15171c; }
  td.rowhead .name { font-size: 15px; color: #dcd3bd; letter-spacing: 2px; }
  td.rowhead .desc { font-size: 12px; color: #7d838e; margin-top: 6px; line-height: 1.7; }
  td.rowhead .verdict { font-size: 12px; color: #a3895a; margin-top: 8px; line-height: 1.7; }
  td.cell { text-align: center; height: 260px; }
  td.cell canvas, td.cell svg, td.cell .imgwrap { display: inline-block; }
  td.cell .imgwrap img { max-height: 225px; border-radius: 4px; }
  .uname { font-size: 13px; color: #9aa2ad; letter-spacing: 3px; margin-bottom: 4px; }
  .utitle { font-size: 11px; color: #666c76; letter-spacing: 1px; }
  .spin-note { font-size: 11px; color: #5d8a75; margin-top: 6px; letter-spacing: 1px; }
  footer { margin-top: 22px; font-size: 12px; color: #6b7280; line-height: 2; }
  footer b { color: #a89b7c; font-weight: 600; }
</style>
</head>
<body>
  <h1>棋子美术技术探索</h1>
  <div class="sub">同一批棋子 · 四条渲染路线并列对比 —— SVG 手绘矢量 / 体素预渲染 / 像素画 / 软件渲染低模 3D（另附 AI 立绘参照）</div>

  <table id="grid">
    <tr id="head"></tr>
  </table>

  <footer id="notes"></footer>

  <script>
    window.addEventListener('error', function (e) {
      var d = document.createElement('div');
      d.style.cssText = 'color:#ff8878;font-size:13px;margin-top:10px;font-family:Consolas,monospace';
      d.textContent = 'JS错误: ' + e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno;
      document.body.appendChild(d);
    });
  </script>
  <script src="svg.js"></script>
  <script src="voxel.js"></script>
  <script src="pixel.js"></script>
  <script src="poly3d.js"></script>
  <script src="main.js"></script>
</body>
</html>
